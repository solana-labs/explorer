name: Update Feature Gates
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *" # Daily at 3:23 am UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}

      # scripts/update-feature-gates.ts imports the feature-gate schema, which reaches the built
      # @explorer/parsers through app/validators/pubkey.ts.
      - name: Build workspace packages
        run: pnpm build:packages

      - name: Update feature gates
        run: pnpm exec tsx scripts/update-feature-gates.ts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch-token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "Update feature gates from Agave wiki"
          title: "Automated Feature Gates Update"
          body: "Auto-generated PR from daily feature gates check"
          branch: "feature-gates-update"
          base: master
          maintainer-can-modify: true
          delete-branch: true
