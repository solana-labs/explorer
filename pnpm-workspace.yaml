packages:
  - packages/*
  - packages/idl-decode/test-anchor-programs/*
  - packages/idl-decode/test-codama-programs/*

autoInstallPeers: true

frozenLockfile: true

catalogs:
  oxc:
    oxfmt: ^0.65.0
    oxlint: ^1.80.0
  storybook:
    '@storybook/addon-a11y': 10.5.10
    '@storybook/addon-docs': 10.5.10
    '@storybook/addon-vitest': 10.5.10
    '@storybook/nextjs-vite': 10.5.10
    '@storybook/react': 10.5.10
    eslint-plugin-storybook: 10.5.10
    storybook: 10.5.10
  tooling:
    '@eslint/js': 9.39.4
    eslint: 9.39.4
    prettier: 3.9.6
    typescript: 5.7.3
  vitest:
    '@vitest/browser': 4.1.11
    '@vitest/browser-playwright': 4.1.11
    '@vitest/coverage-v8': 4.1.11
    jsdom: 26.0.0
    vitest: 4.1.11

ignoreScripts: true

minimumReleaseAge: 20160

# TODO: remove exclusion 
minimumReleaseAgeExclude:
  - sas-lib

# Pin resolution to the public npm registry so it can't silently inherit a
# global/org .npmrc mirror. Scoped keys (e.g. '@my-org') can be added here.
registries:
  default: https://registry.npmjs.org/
